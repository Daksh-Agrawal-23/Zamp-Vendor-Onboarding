<h1 id=title>Verification run</h1><div class=row style="align-items:start"><div class=card><h2>Progress</h2><div id=stages></div></div>
<div><div class=card id=outcome aria-live=polite><h2>Outcome</h2><span class=mut>Running...</span></div><div class=card><h2>Checks as they run</h2><div id=finds><span class=mut>None yet</span></div></div></div></div>
<div class=card id=prof style="display:none"><h2>Vendor profile for Accounts Payable</h2><div id=profb></div></div>
<div class=card id=docs style="display:none"><h2>Documents received</h2><div id=thumbs style="display:flex;gap:14px;flex-wrap:wrap"></div></div>
<div class=card id=matrix style="display:none"><h2>Claims vs evidence</h2><table id=mt></table></div>
<div class=card id=audit style="display:none"><details><summary><b>Audit trail</b> <small id=chain></small></summary><pre id=log class=mono></pre></details></div>
<script>const rid="{{rid}}",ORDER={{order|tojson}},LABEL={{label|tojson}};let timer;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let fails=0;async function tick(){let d;try{const r=await fetch('/api/run/'+rid);if(!r.ok)throw 0;d=await r.json();fails=0}catch(e){if(++fails>5){clearInterval(timer);document.getElementById('outcome').innerHTML='<h2>Outcome</h2><span class=mut role=alert>Lost contact with the server. Reload this page to resume.</span>'}return}document.getElementById('title').textContent='Verification: '+(d.name||'');
const seen=new Set(d.events.map(e=>e.stage)),fin=d.status!=='Running';let h='';
ORDER.forEach((s,i)=>{const done=fin||[...ORDER.slice(i+1)].some(x=>seen.has(x));const now=seen.has(s)&&!done;h+='<div class=stage><div class="dot '+(done?'done':now?'now':'')+'"></div><div><b>'+LABEL[s]+'</b></div></div>'});
document.getElementById('stages').innerHTML=h;
const fl=d.events.filter(e=>e.stage==='finding');document.getElementById('finds').innerHTML=fl.length?fl.map(e=>{const k=e.msg.startsWith('OK')?'OK':e.msg.startsWith('Needs a fix')?'P':e.msg.startsWith('Needs a person')?'E':e.msg.startsWith('Cannot')?'R':'';return '<div class="f '+k+'">'+esc(e.msg)+'</div>'}).join(''):'<span class=mut>None yet</span>';
if(fin&&d.result){clearInterval(timer);const r=d.result;let o='<h2>Outcome</h2><span class="pill '+d.status+'" style="font-size:15px">'+d.status+'</span> <span class=mut>Risk tier: '+(d.tier||'-')+'</span>';
if(r.summary)o+='<p style="font-size:15px"><b>'+esc(r.summary)+'</b></p>';o+='<p style="white-space:pre-wrap">'+esc(r.vendor_message||'')+'</p>';
if(d.status==='Pending'&&!((r.findings||[]).length&&(r.findings||[]).every(x=>x.rule==='R26'||x.outcome==='F')))o+='<a class=btn href="/new?from='+rid+'">Correct &amp; resubmit</a> ';
(d.reviews||[]).forEach(x=>o+='<p class=mut>Reviewer '+esc(x.reviewer)+': '+esc(x.decision)+' - '+esc(x.reason)+'</p>');
document.getElementById('outcome').innerHTML=o;if(r.profile){const p=r.profile,pb=document.getElementById('profb');pb.innerHTML='<table><tr><th>Payment hold</th><td>'+(p.payment_hold?'<b>YES</b> until approved':'No')+'</td></tr><tr><th>TDS</th><td>'+p.tds+'</td></tr><tr><th>MSME terms</th><td>'+(p.msme_terms||'-')+'</td></tr><tr><th>GST mode</th><td>'+p.gst_mode+'</td></tr><tr><th>Risk tier</th><td>'+p.risk_tier+'</td></tr><tr><th>Verified as of</th><td>'+p.verified_as_of+' <small>(rules '+p.rules_version+')</small></td></tr><tr><th>Evidence strength</th><td>'+Object.entries(p.evidence).map(([k,v])=>({legal_name:'Legal name',gstin:'GSTIN',pan:'PAN',ifsc:'IFSC',account:'Bank account',cin:'CIN',udyam:'Udyam',state:'State'}[k]||k)+': '+({T1:'official registry or bank',T2:'document read',T4:'self-declared'}[v.best_evidence]||v.best_evidence)+(v.reverify_by?' (re-verify by '+v.reverify_by+')':'')).join('<br>')+'</td></tr>'+(p.flags.length?'<tr><th>Soft flags</th><td>'+p.flags.map(esc).join('<br>')+'</td></tr>':'')+'</table><small>Evidence strength: official registry or bank, document read, or self-declared. <a href="/export/'+rid+'.json">Export JSON</a>'+(d.status==='Approved'?' · <a href="/reverify/'+rid+'">Re-verify</a>':'')+'</small>';document.getElementById('prof').style.display='block'}const M=r.matrix||{};const cols=['declared','document','registry','bank','cheque','sanctions'];const names={legal_name:'Legal name',gstin:'GSTIN',pan:'PAN',ifsc:'IFSC',account:'Bank account',state:'State',cin:'CIN'};let t='<tr><th>Field</th><th>You declared</th><th>Documents say</th><th>Registry / bank says</th><th></th></tr>';Object.keys(M).filter(k=>names[k]).forEach(k=>{const m=M[k];const ev=[m.registry,m.bank,m.sanctions].filter(Boolean).join(' | ');const v=m.verdict;const badge=v?'<span class="pill '+({P:'Pending',E:'Escalated',R:'Rejected',F:'Pending'}[v])+'">'+({P:'fix',E:'review',R:'reject',F:'note'}[v])+'</span>':((m.document||(ev&&!/not run/.test(ev)))?'<span class="pill Approved">ok</span>':'<span class=mut>not checked</span>');t+='<tr><td>'+names[k]+'</td><td class=mono>'+esc(m.declared||'-')+'</td><td class=mono>'+esc([m.document,m.cheque].filter(Boolean).join(' | ')||'-')+'</td><td class=mono>'+esc(ev||'-')+'</td><td>'+badge+'</td></tr>'});document.getElementById('mt').innerHTML=t;document.getElementById('matrix').style.display='';const T={gst_cert:'GST certificate / invoice',cheque:'Cancelled cheque',pan_card:'PAN card'};const have=(r.docs_present||[]);if(have.length){document.getElementById('docs').style.display='';document.getElementById('thumbs').innerHTML=have.map(k=>'<a href="/file/'+rid+'/'+k+'" target=_blank><img src="/file/'+rid+'/'+k+'" style="height:150px;border:1px solid #ddd;border-radius:6px"><div class=mut>'+T[k]+'</div></a>').join('')}document.getElementById('audit').style.display='';
document.getElementById('chain').textContent='Hash chain '+(r.audit_ok?'verified':'BROKEN')+' - '+(r.audit||[]).length+' entries';
document.getElementById('log').textContent=(r.audit||[]).map(a=>a.hash+'  '+a.stage+' / '+a.event+'  '+JSON.stringify(a.data)).join('\n')}}
tick();timer=setInterval(tick,700);</script>
