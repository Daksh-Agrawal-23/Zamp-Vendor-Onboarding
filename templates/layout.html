<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Vendor onboarding</title><style>
:root{--bg:#f6f7f9;--ink:#1c2430;--mut:#667085;--line:#e3e6eb;--card:#fff;--ok:#157f4a;--pend:#b7791f;--esc:#b4531a;--rej:#c0262d;--acc:#2b59c3}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:24px;align-items:center}
header b{font-size:16px}header a{color:var(--mut);text-decoration:none}header a:hover,header a.on{color:var(--ink)}
main{max-width:1100px;margin:24px auto;padding:0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 14px}h2{font-size:16px;margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:600}.pill{white-space:nowrap;display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.Approved{background:var(--ok)}.Pending{background:var(--pend)}.Escalated{background:var(--esc)}.Rejected{background:var(--rej)}.Running{background:var(--acc)}.Closed{background:#667085}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.kpi b{font-size:26px;display:block}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cfd4dc;border-radius:7px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}button,.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cfd4dc}.stage{display:flex;gap:10px;padding:7px 0;align-items:flex-start}.dot{width:14px;height:14px;border-radius:50%;background:#cfd4dc;margin-top:5px;flex:none}
.dot.done{background:var(--ok)}.dot.now{background:var(--acc);animation:p 1s infinite}@keyframes p{50%{opacity:.35}}.f{padding:7px 10px;border-left:4px solid;margin:6px 0;background:#fafbfc;font-size:14px}
.f.OK{border-color:var(--ok)}.f.P{border-color:var(--pend)}.f.E{border-color:var(--esc)}.f.R{border-color:var(--rej)}.mut{color:var(--mut)}.mono{font-family:ui-monospace,monospace;font-size:12.5px}small{color:var(--mut)}
@media(max-width:720px){.row{grid-template-columns:1fr}header{flex-wrap:wrap;gap:10px 16px;padding:10px 14px}main{padding:0 12px;margin:14px auto}table{display:block;overflow-x:auto}.grid{grid-template-columns:1fr 1fr}}
input:focus,select:focus,button:focus,a:focus{outline:3px solid #2b59c3;outline-offset:1px}
details{margin-top:8px}main{overflow-wrap:anywhere}button,.btn{white-space:nowrap}.btn.sec{white-space:normal;max-width:100%;text-align:left}th{white-space:nowrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;overflow-x:auto;background:#f1f3f6;padding:10px;border-radius:8px;font-size:13px}.tabs a{margin-right:6px}
</style></head><body><header><b>Vendor onboarding</b><a href="/" class="{{'on' if nav=='d'}}">Dashboard</a><a href="/new" class="{{'on' if nav=='n'}}">New vendor</a>
<a href="/review" class="{{'on' if nav=='r'}}">Review queue</a><a href="/outbox" class="{{'on' if nav=='o'}}">Vendor emails</a><a href="/eval" class="{{'on' if nav=='e'}}">Evaluation</a><a href="/guide">Guide</a><span style="margin-left:auto" class=mut>{{session.get('user')}} ({{session.get('role')}}) <form method=post action="/logout" style="display:inline"><button class="btn sec" style="padding:2px 10px">Sign out</button></form></span></header><main>{{body|safe}}</main><script>document.querySelectorAll('label').forEach(function(l,n){var i=l.querySelector('input,select,textarea')||(l.nextElementSibling&&l.nextElementSibling.querySelector&&(l.nextElementSibling.matches('input,select,textarea')?l.nextElementSibling:null));if(i&&!l.htmlFor){if(!i.id)i.id='f'+n+'_'+(i.name||'x');if(!l.contains(i))l.htmlFor=i.id}});document.querySelectorAll('img:not([alt])').forEach(function(i){i.alt='uploaded document'});document.querySelectorAll('form[method=post]').forEach(function(f){if(!f.querySelector('[name=_csrf]')){var i=document.createElement('input');i.type='hidden';i.name='_csrf';i.value='{{csrf_token()}}';f.appendChild(i)}});
var _f=window.fetch;window.fetch=function(u,o){o=o||{};if((o.method||'GET')!=='GET'){o.headers=Object.assign({'X-CSRF':'{{csrf_token()}}'},o.headers||{})}return _f(u,o)}</script></body></html>
