<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Vendor registration</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f6f7f9;color:#1c2430}main{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e3e6eb;border-radius:12px;padding:18px;margin-bottom:14px}label{display:block;font-size:14px;color:#445;margin:12px 0 4px}
input,select{width:100%;padding:11px;border:1px solid #bcc3cf;border-radius:8px;font:inherit;background:#fff}input:focus,select:focus,button:focus{outline:3px solid #2b59c3;outline-offset:1px}
button{background:#2b59c3;color:#fff;border:0;border-radius:8px;padding:13px 20px;font:inherit;width:100%;margin-top:16px}small{color:#556}.err{color:#a00}
.status{font-size:20px;font-weight:700}.ok{color:#157f4a}.warn{color:#9a5b00}.bad{color:#b00}.prev{max-width:120px;max-height:90px;border-radius:6px;margin-top:6px;display:block}
</style></head><body><main>{{body|safe}}</main><script></script></body></html>
